[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halle_tram"
version = "0.1.0"
description = "Live tram/bus departures for Halle (Saale) via GTFS + GTFS-RT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joris Kaestner" }]

dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "gtfs-realtime-bindings>=1.0",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/JorisKaestner/halle_tram"

[tool.hatch.build.targets.wheel]
packages = ["src/halle_tram"]